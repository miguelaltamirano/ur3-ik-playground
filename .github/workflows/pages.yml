name: Publish student website

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the source
        uses: actions/checkout@v6
      - name: Check JavaScript syntax and solver results
        run: |
          node --check dist/app.js
          node --check dist/math.js
          node --check dist/viewer.js
          node --check dist/robot-model.js
          node --check dist/python-runner.js
          node --check dist/python-worker.js
          node qa/check.mjs
      - name: Set up Python for solver checks
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Check editable Python examples
        run: |
          python -m pip install numpy==2.2.6
          python qa/check_python.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
